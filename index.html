/* ---------- save (key kept from the first web release so old saves survive) ---------- */
const SAVE_KEY = "ember_drift_save_v1";
function defaultSave() {
  return { shards: 0, cleared: [], up: Object.fromEntries(UPGRADES.map(u => [u.key, 0])), mem: [], intro: [], prologue: false };
}
function levelList(v) {
  if (!Array.isArray(v)) return [];
  const out = [];
  for (const x of v) { const i = parseInt(x); if (Number.isFinite(i) && i >= 0 && i < LEVELS.length && !out.includes(i)) out.push(i); }
  return out;
}
function loadSave() {
  const d = defaultSave();
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (raw && typeof raw === "object" && !Array.isArray(raw)) {
      d.shards = Math.max(0, parseInt(raw.shards) || 0);
      d.cleared = levelList(raw.cleared).sort((a, b) => a - b);
      d.prologue = !!raw.prologue;
      d.mem = levelList(raw.mem);
      d.intro = levelList(raw.intro);
      const up = raw.up && typeof raw.up === "object" ? raw.up : {};
      for (const u of UPGRADES) d.up[u.key] = clamp(parseInt(up[u.key]) || 0, 0, u.max);
    }
  } catch (e) {}
  return d;
}
